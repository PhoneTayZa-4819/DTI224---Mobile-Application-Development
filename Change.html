<Change html>
<html>
<head>
    <title>Calculate Change</title>

    <script>
        function calculateChange() {
            // Retrieve the input and convert it to a number
            let amount = Number(document.getElementById("amount").value);
            let resultText = "";

            // Array of objects representing the denominations
            const denominations = [
                { value: 1000, name: "$1000 note" },
                { value: 500, name: "$500 note" },
                { value: 100, name: "$100 note" },
                { value: 50, name: "$50 note" },
                { value: 20, name: "$20 note" },
                { value: 10, name: "$10 coin" },
                { value: 5, name: "$5 coin" },
                { value: 2, name: "$2 coin" },
                { value: 1, name: "$1 coin" }
            ];

            // Ensure the amount is a valid number (0 or greater)
            if (amount < 0 || isNaN(amount)) {
                document.getElementById("result").innerHTML = "Please enter a valid amount.";
                return;
            }

            // Loop through all denominations
            for (let denom of denominations) {
                // Calculate how many of the current denomination fit
                let count = Math.floor(amount / denom.value);
                
                // Add to result string EVERY time, even if count is 0
                resultText += count + " of " + denom.name + "<br>";
                
                // Update the remaining amount
                amount = amount % denom.value;
            }

            // Output the final result to the HTML paragraph
            document.getElementById("result").innerHTML = resultText;
        }
    </script>

</head>

<body>

    <h2>Calculate Change</h2>

    <div>
        <label for="amount">Enter Amount: </label>
        <input type="number" id="amount">
        <button onclick="calculateChange()">Submit</button>
    </div>

    <!-- Paragraph to display the results -->
    <p id="result"></p>

</body>
</html>
