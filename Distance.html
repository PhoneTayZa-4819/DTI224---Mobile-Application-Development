<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance from University</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button { 
            padding: 8px 16px; 
            cursor: pointer;
            margin-top: 10px;
        }
        #result { 
            margin-top: 20px; 
            font-size: 1.1em;
            line-height: 1.6;
        }
    </style>
    <script>
        const uniLat = 13.7384;
        const uniLon = 100.6279;

        function calculateDistance() {
            let output = document.getElementById("result");
            output.innerHTML = "Locating your position...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let userLat = position.coords.latitude;
                    let userLon = position.coords.longitude;
                    let x = userLat - uniLat;
                    let y = userLon - uniLon;
                    let distance = Math.sqrt(Math.pow(x, 2) + Math.pow(y, 2));

                    output.innerHTML = 
                        "<strong>University Coordinates:</strong> " + uniLat.toFixed(4) + ", " + uniLon.toFixed(4) + "<br>" +
                        "<strong>Your Coordinates:</strong> " + userLat.toFixed(4) + ", " + userLon.toFixed(4) + "<br><br>" +
                        "<strong>Raw Distance (Coordinate Units): " + distance.toFixed(4) + "</strong>";
                }, function(error) {
                    output.innerHTML = "Error retrieving location: " + error.message;
                });
            } else {
                output.innerHTML = "Geolocation is not supported by this browser.";
            }
        }
    </script>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>

    <h2>How far from University?</h2>
    <div>
        <button onclick="calculateDistance()">Get Distance</button>
    </div>
    <p id="result">Click the button to find your distance.</p>
</body>
</html>
