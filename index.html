<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTI224 JavaScript Lab</title>

    <!-- 1. LINK TO PWA MANIFEST -->
    <link rel="manifest" href="manifest.json">

    <!-- 2. REGISTER PWA SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Registered'));
      }
    </script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .header-box {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .subtitle {
            color: #555555;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .menu-btn {
            display: block;
            background-color: #1d72f3;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 10px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .menu-btn:hover {
            background-color: #155bb5;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 28px;
            color: #777777;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Section -->
        <div class="header-box">
            MOBILE APPLICATION DEVELOPMENT 
        </div>

        <p class="subtitle">Select an assignment.</p>

        <!-- Assignment Buttons -->
        <a class="menu-btn" href="Resume.html">Resume</a>
        
        <a class="menu-btn" href="Hobby.html">Hobby</a>
        
        <a class="menu-btn" href="Converter.html">Converter</a>
        
        <a class="menu-btn" href="Grading.html">Grading</a>
        
        <a class="menu-btn" href="Change.html">Change</a>
        
        <a class="menu-btn" href="Distance.html">Distance</a>

        <!-- NEW DRAG AND DROP BUTTON ADDED HERE -->
        <a class="menu-btn" href="DragDrop.html">Drag & Drop</a>

        <!-- Footer -->
        <div class="footer">DTI224 JavaScript Lab</div>

    </div>

</body>
</html>
